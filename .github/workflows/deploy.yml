name: Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            cd /home/enpii/apps/simak
            git pull origin master
            docker compose -p simak-legacy up -d --build
            # Tunggu FPM siap: exec instan setelah recreate gagal bila container
            # baru saja start (race "service app is not running").
            for i in $(seq 1 30); do
              if docker compose -p simak-legacy exec -T app php -v >/dev/null 2>&1; then break; fi
              sleep 2
            done
            docker compose -p simak-legacy exec -T app composer install
            docker compose -p simak-legacy exec -T app php artisan optimize:clear
